name: Deploy

on:
  workflow_dispatch:
    inputs:
      load_physics_conspects:
        description: "Загрузить 14 конспектов по физике и оглавление"
        type: boolean
        default: false

env:
  DEPLOY_HOST: 89.111.136.194
  DEPLOY_USER: deploy
  REMOTE_PATH: /home/deploy/PO_BVI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Download olympiad archive
        run: |
          archive="$RUNNER_TEMP/pobvi-olympiad-content-2026-11-18.tar.gz"
          curl --fail --show-error --silent --location --retry 5 --output "$archive" \
            "https://github.com/LilFreezyV/Po_BVI/releases/download/olympiad-content-2026-11-18/pobvi-olympiad-content-2026-11-18.tar.gz"
          echo "2bb045093bb82902bdabe0bfd3af5c9b13a2f30550c27fe1c94e8816c42af6f7  $archive" | sha256sum --check
          tar -xzf "$archive" -C public
          test -s public/olympiad-content/index.json

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Free disk space before upload
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REMOTE_PATH" <<'REMOTE'
          set -euo pipefail
          releases="$1/releases"
          current=$(readlink -f -- "$1/current")
          test -d "$releases"
          test -d "$current"
          [[ "$current" == "$releases/"* && "${current#"$releases/"}" != */* ]]
          available=$(df -Pk "$releases" | awk 'NR == 2 {print $4}')
          threshold=$((3 * 1024 * 1024))
          echo "Available: ${available} KiB; minimum: ${threshold} KiB"
          if (( available < threshold )); then
            removed=0
            for release in "$releases"/[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]; do
              [[ -d "$release" && ! -L "$release" ]] || continue
              [[ "$release" != "$current" ]] || continue
              echo "Removing old release: $release"
              rm -rf -- "$release"
              ((removed+=1))
              (( removed < 2 )) || break
            done
            available=$(df -Pk "$releases" | awk 'NR == 2 {print $4}')
            echo "Available after cleanup: ${available} KiB"
            if (( available < threshold )); then
              echo 'Not enough disk space after removing up to two old releases; stop deployment.' >&2
              exit 1
            fi
          fi
          REMOTE

      - name: Upload new release
        id: release
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $REMOTE_PATH/releases/$TS"
          rsync -az --link-dest="$REMOTE_PATH/current" -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_PATH/releases/$TS/"

      - name: Switch current symlink
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "ln -sfn releases/${{ steps.release.outputs.ts }} $REMOTE_PATH/current"

      - name: Update backend code and run migrations
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $REMOTE_PATH
            git pull
            source backend/.venv/bin/activate
            pip install -q -r backend/requirements.txt
            cd backend
            python -m alembic upgrade head
          "

      - name: Load physics conspects
        if: inputs.load_physics_conspects
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $REMOTE_PATH
            backend/.venv/bin/python conspects/build.py
            cd backend
            .venv/bin/python -m scripts.load_conspects ../conspects/dist/physics --subject physics --dry-run
            .venv/bin/python -m scripts.load_conspects ../conspects/dist/physics --subject physics
          "

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo systemctl restart bvi-backend && sudo systemctl reload nginx"

      - name: Health check
        timeout-minutes: 3
        run: |
          sleep 3
          curl_options=(--fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors)
          curl "${curl_options[@]}" -o /dev/null "http://$DEPLOY_HOST/api/subjects" && echo "Деплой ОК" || (echo "Бэкенд не отвечает после деплоя!" && exit 1)
          curl "${curl_options[@]}" -o /dev/null "http://$DEPLOY_HOST/" && echo "Фронтенд ОК" || (echo "Фронтенд не отвечает после деплоя!" && exit 1)

      - name: Verify published olympiad archive
        timeout-minutes: 3
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${REMOTE_PATH:?REMOTE_PATH is required}"
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"

          expected="dist/olympiad-content/index.json"
          published="$RUNNER_TEMP/published-archive-index.json"
          test -s "$expected"

          if curl --fail --silent --show-error --remove-on-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 2 --retry-all-errors \
            --output "$published" "http://$DEPLOY_HOST/olympiad-content/index.json"; then
            if ! cmp -s "$expected" "$published"; then
              echo "::error::Published archive index differs from the built release."
              sha256sum "$expected" "$published"
              exit 1
            fi
            echo "Published olympiad archive matches the built release."
          else
            status=$?
            echo "::error::External archive check failed (curl exit $status). Checking the VPS over SSH."
            echo "Expected archive index:"
            sha256sum "$expected"
            if ! ssh -i "$HOME/.ssh/deploy_key" \
              -o BatchMode=yes -o ConnectTimeout=10 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REMOTE_PATH" "$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          index="$1/current/olympiad-content/index.json"
          test -s "$index"
          ls -lh "$index"
          sha256sum "$index"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            --header "Host: $2" --output /dev/null \
            --write-out 'VPS-local archive check: HTTP %{http_code}, %{time_total}s\n' \
            http://127.0.0.1/olympiad-content/index.json
          REMOTE
            then
              echo "::warning::VPS diagnostics also failed. Check SSH access, the published file and nginx logs."
            fi
            # Local availability alone does not prove that visitors can reach the archive.
            exit "$status"
          fi

      - name: Verify published physics conspects
        if: inputs.load_physics_conspects
        timeout-minutes: 3
        run: |
          set -o pipefail
          curl_options=(--fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 --retry-all-errors)
          curl "${curl_options[@]}" --remove-on-error \
            -o "$RUNNER_TEMP/published-physics-conspects.json" \
            "http://$DEPLOY_HOST/api/conspects?subject=physics"
          jq -e 'map(.number) | sort == [range(0; 15)]' \
            "$RUNNER_TEMP/published-physics-conspects.json" > /dev/null
          curl "${curl_options[@]}" -o /dev/null "http://$DEPLOY_HOST/api/conspects/physics/0"

      - name: Clean up old releases (keep last 5)
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $REMOTE_PATH/releases && ls -t | tail -n +6 | xargs -r rm -rf"
